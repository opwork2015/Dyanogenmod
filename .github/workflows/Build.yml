name: Stock ROM to rom folder

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: "MediaFire page link"
        required: true
        default: "https://www.mediafire.com/download/swq21w929oz1udm/Stock_ROM_Advanced.zip"
        type: string

permissions:
  contents: write

jobs:
  rom:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils p7zip-full python3 unzip
          curl -sL -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      # 1. استخراج الرابط المباشر من صفحة MediaFire وتنزيل الملف
      - name: Download from MediaFire
        run: |
          curl -sL -A "Mozilla/5.0" "${{ inputs.mediafire_url }}" -o page.html
          DIRECT=$(grep -oE 'https://download[^"]+' page.html | head -1)
          test -n "$DIRECT" || (echo "::error::direct link not found" && exit 1)
          curl -L -A "Mozilla/5.0" -o stock.zip "$DIRECT"
          ls -lh stock.zip
          unzip -tq stock.zip

      # 2. فك الملف كاملاً دون تخفيف داخل مجلد rom
      - name: Unzip everything into rom/
        run: |
          mkdir -p rom
          unzip -q stock.zip -d rom
          find rom -maxdepth 2 | head -100

      # 3. فك system و data من الصور أو صيغة sdat
      - name: Extract system and data
        run: |
          mkdir -p rom/_extracted/system rom/_extracted/data

          # system
          if [ -f rom/system.img ]; then
            simg2img rom/system.img system.raw.img || cp rom/system.img system.raw.img
          elif [ -f rom/system.new.dat ]; then
            python3 sdat2img.py rom/system.transfer.list rom/system.new.dat system.raw.img
          fi
          [ -f system.raw.img ] && 7z x -y system.raw.img -orom/_extracted/system > /dev/null || echo "::warning::system not extracted"

          # data
          if [ -f rom/data.img ]; then
            simg2img rom/data.img data.raw.img || cp rom/data.img data.raw.img
          elif [ -f rom/data.new.dat ]; then
            python3 sdat2img.py rom/data.transfer.list rom/data.new.dat data.raw.img
          fi
          [ -f data.raw.img ] && 7z x -y data.raw.img -orom/_extracted/data > /dev/null || echo "::warning::data not extracted"

          echo "system files: $(find rom/_extracted/system -type f | wc -l)"
          echo "data files: $(find rom/_extracted/data -type f | wc -l)"

      # 4. حذف الملفات الكبيرة التي يرفضها GitHub (أكبر من 95MB)
      

      # 5. الالتزام بالمستودع
      - name: Commit rom folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rom
          git commit -m "Add stock ROM unpacked to rom/" || echo "Nothing to commit"
          git push

      # 6. نسخة احتياطية كاملة كـ artifact (بدون حد الـ 100MB)
      - name: Upload full output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-full
          path: rom
          retention-days: 14
