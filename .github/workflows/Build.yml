name: Download, unzip and commit stock ROM

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: "MediaFire page link"
        required: true
        default: "https://www.mediafire.com/download/swq21w929oz1udm/Stock_ROM_Advanced.zip"
        type: string
      target_folder:
        description: "Folder in the repo to store the unzipped ROM"
        required: true
        default: "stock-rom"
        type: string

permissions:
  contents: write

jobs:
  download-unzip-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      # 1. استخراج الرابط المباشر من صفحة MediaFire
      - name: Resolve direct link
        run: |
          curl -sL -A "Mozilla/5.0" "${{ inputs.mediafire_url }}" -o page.html
          DIRECT=$(grep -oE 'https://download[^"]+' page.html | head -1)
          if [ -z "$DIRECT" ]; then
            echo "::error::Could not find direct link on MediaFire page"
            exit 1
          fi
          echo "DIRECT=$DIRECT" >> $GITHUB_ENV

      # 2. تنزيل الملف
      - name: Download ROM
        run: |
          curl -L -A "Mozilla/5.0" -o stock.zip "$DIRECT"
          ls -lh stock.zip
          unzip -tq stock.zip

      # 3. فك الملف داخل مجلد الهدف
      - name: Unzip ROM
        run: |
          mkdir -p "${{ inputs.target_folder }}"
          unzip -q stock.zip -d "${{ inputs.target_folder }}"
          find "${{ inputs.target_folder }}" -type f -exec ls -lh {} \; | head -80

      # 4. حذف الملفات الأكبر من 95MB لأن GitHub يرفض ما فوق 100MB
      - name: Remove files larger than 95MB
        run: |
          find "${{ inputs.target_folder }}" -type f -size +95M -print -delete > too_big.txt || true
          if [ -s too_big.txt ]; then
            echo "::warning::These files were skipped because GitHub limits files to 100MB:"
            cat too_big.txt
          fi

      # 5. الالتزام بالمستودع ورفع الملفات
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.target_folder }}"
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add unzipped stock ROM to ${{ inputs.target_folder }}"
            git push
          fi
