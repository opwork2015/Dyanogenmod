name: Merge device, vendor and kernel

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # 1. تحميل شجرة الجهاز المشتركة
      - name: Clone device tree
        run: |
          mkdir -p merged/device/samsung
          git clone --depth=1 -b cm-12.1 https://github.com/nikolaoskalomiris/android_device_samsung_j5-common.git merged/device/samsung/j5-common

      # 2. تحميل ملفات الـ vendor
      - name: Clone vendor blobs
        run: |
          mkdir -p merged/vendor/samsung
          git clone --depth=1 -b cm-12.1 https://github.com/nikolaoskalomiris/proprietary_vendor_samsung_j5nltexx.git merged/vendor/samsung/j5nltexx

      # 3. تحميل الكيرنل
      - name: Clone kernel
        run: |
          mkdir -p merged/kernel/samsung
          git clone --depth=1 https://github.com/DJSteve/kernel_j500fn_djsteve.git merged/kernel/samsung/msm8916

      # 4. التحقق من أن الملفات الأساسية موجودة
      - name: Verify merged tree
        run: |
          test -f merged/device/samsung/j5-common/BoardConfigCommon.mk || (echo "::error::missing BoardConfigCommon.mk" && exit 1)
          test -f merged/vendor/samsung/j5nltexx/j5nltexx-vendor.mk || (echo "::error::missing vendor makefile" && exit 1)
          test -d merged/kernel/samsung/msm8916/arch || (echo "::error::missing kernel arch folder" && exit 1)
          echo "All three parts found"
          du -sh merged/*

      # 5. ضغط الناتج في ملف واحد ورفعه
      - name: Pack into one zip
        run: |
          cd merged && zip -qr ../merged-tree.zip . && cd ..
          ls -lh merged-tree.zip

      - name: Upload merged tree
        uses: actions/upload-artifact@v4
        with:
          name: merged-tree
          path: merged-tree.zip
          retention-days: 14
