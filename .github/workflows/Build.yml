name: Assemble flashable zip

on:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      # 1. تحميل المستودع الحالي (فيه flashable/META-INF)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. تحميل ملفات الـ vendor
      - name: Clone vendor blobs
        run: |
          git clone --depth=1 -b cm-12.1 https://github.com/nikolaoskalomiris/proprietary_vendor_samsung_j5nltexx.git vendor-src

      # 3. نسخ ملفات الـ vendor إلى مجلد system داخل الحزمة
      - name: Copy vendor into system
        run: |
          mkdir -p flashable/system
          if [ -d vendor-src/proprietary ]; then
            cp -r vendor-src/proprietary/. flashable/system/
          else
            cp -r vendor-src/. flashable/system/
          fi
          rm -rf flashable/system/.git
          find flashable/system -type f | wc -l

      # 4. كتابة سكربت التثبيت
      - name: Write updater-script
        run: |
          mkdir -p flashable/META-INF/com/google/android
          cat > flashable/META-INF/com/google/android/updater-script << 'EOF'
          ui_print("Installing DyanogenMod j5lte");
          mount("ext4", "EMMC", "/dev/block/bootdevice/by-name/system", "/system");
          package_extract_dir("system", "/system");
          unmount("/system");
          ui_print("System installed");
          EOF

      # 5. ضغط الحزمة كملف zip واحد
      - name: Pack flashable zip
        run: |
          cd flashable && zip -qr ../dyanogenmod-j5lte-flashable.zip . && cd ..
          ls -lh dyanogenmod-j5lte-flashable.zip

      # 6. رفع الملف
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: dyanogenmod-j5lte-flashable
          path: dyanogenmod-j5lte-flashable.zip
          retention-days: 14
