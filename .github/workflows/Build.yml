name: Download, unzip and unpack ROM

on:
  workflow_dispatch:

jobs:
  rom:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils p7zip-full python3 curl unzip
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      - name: Download from MediaFire
        run: |
          URL="https://www.mediafire.com/download/swq21w929oz1udm/Stock_ROM_Advanced.zip"
          curl -sL -A "Mozilla/5.0" "$URL" -o page.html
          DIRECT=$(grep -oE 'https://download[^"]+' page.html | head -1)
          if [ -z "$DIRECT" ]; then
            echo "::error::Direct link not found on MediaFire page"
            exit 1
          fi
          curl -L -A "Mozilla/5.0" -o Stock_ROM_Advanced.zip "$DIRECT"
          ls -lh Stock_ROM_Advanced.zip
          unzip -tq Stock_ROM_Advanced.zip

      - name: Unzip ROM fully into rom/
        run: |
          mkdir -p rom
          unzip -q Stock_ROM_Advanced.zip -d rom
          find rom -maxdepth 2 -exec ls -ld {} \; | head -100

      - name: Unpack system into rom/system
        run: |
          mkdir -p rom/system
          SRC=$(find rom -name "system.img" -o -name "system.new.dat" | head -1)
          if [ -n "$(find rom -name 'system.img' | head -1)" ]; then
            IMG=$(find rom -name "system.img" | head -1)
            simg2img "$IMG" system.raw.img || cp "$IMG" system.raw.img
          elif [ -n "$(find rom -name 'system.new.dat' | head -1)" ]; then
            LIST=$(find rom -name "system.transfer.list" | head -1)
            DAT=$(find rom -name "system.new.dat" | head -1)
            python3 sdat2img.py "$LIST" "$DAT" system.raw.img
          else
            echo "::error::No system image found in ROM"
            exit 1
          fi
          7z x -y system.raw.img -orom/system > /dev/null || true
          echo "system files: $(find rom/system -type f | wc -l)"

      - name: Unpack data into rom/data
        run: |
          mkdir -p rom/data
          if [ -n "$(find rom -name 'data.img' | head -1)" ]; then
            IMG=$(find rom -name "data.img" | head -1)
            simg2img "$IMG" data.raw.img || cp "$IMG" data.raw.img
          elif [ -n "$(find rom -name 'userdata.img' | head -1)" ]; then
            IMG=$(find rom -name "userdata.img" | head -1)
            simg2img "$IMG" data.raw.img || cp "$IMG" data.raw.img
          elif [ -n "$(find rom -name 'data.new.dat' | head -1)" ]; then
            LIST=$(find rom -name "data.transfer.list" | head -1)
            DAT=$(find rom -name "data.new.dat" | head -1)
            python3 sdat2img.py "$LIST" "$DAT" data.raw.img
          else
            echo "::warning::No data image found, skipping"
            exit 0
          fi
          7z x -y data.raw.img -orom/data > /dev/null || true
          echo "data files: $(find rom/data -type f | wc -l)"

      - name: Upload rom folder
        uses: actions/upload-artifact@v4
        with:
          name: rom-folder
          path: rom
          retention-days: 14
