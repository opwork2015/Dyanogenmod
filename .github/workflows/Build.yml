name: Unpack system and data

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: "Folder in the repo that holds the ROM files"
        required: true
        default: "stock-rom"
        type: string

jobs:
  unpack:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils p7zip-full python3 curl
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      - name: Check source files
        run: |
          ls -lh "${{ inputs.source_folder }}"
          test -d "${{ inputs.source_folder }}" || (echo "::error::folder not found" && exit 1)

      # 1. تحويل system إلى صورة ext4 خام
      - name: Prepare system image
        run: |
          SRC="${{ inputs.source_folder }}"
          if [ -f "$SRC/system.img" ]; then
            simg2img "$SRC/system.img" system.raw.img || cp "$SRC/system.img" system.raw.img
          elif [ -f "$SRC/system.new.dat" ]; then
            python3 sdat2img.py "$SRC/system.transfer.list" "$SRC/system.new.dat" system.raw.img
          else
            echo "::error::No system image found"; exit 1
          fi
          ls -lh system.raw.img

      # 2. تحويل data إلى صورة ext4 خام (يدعم data.img و userdata.img و data.new.dat)
      - name: Prepare data image
        run: |
          SRC="${{ inputs.source_folder }}"
          if [ -f "$SRC/data.img" ]; then
            simg2img "$SRC/data.img" data.raw.img || cp "$SRC/data.img" data.raw.img
          elif [ -f "$SRC/userdata.img" ]; then
            simg2img "$SRC/userdata.img" data.raw.img || cp "$SRC/userdata.img" data.raw.img
          elif [ -f "$SRC/data.new.dat" ]; then
            python3 sdat2img.py "$SRC/data.transfer.list" "$SRC/data.new.dat" data.raw.img
          else
            echo "::warning::No data image found, skipping"
            exit 0
          fi
          ls -lh data.raw.img

      # 3. فك system و data إلى مجلدات
      - name: Extract folders
        run: |
          mkdir -p out/system out/data
          7z x -y system.raw.img -oout/system > /dev/null || true
          if [ -f data.raw.img ]; then 7z x -y data.raw.img -oout/data > /dev/null || true; fi
          echo "system files: $(find out/system -type f | wc -l)"
          echo "data files: $(find out/data -type f 2>/dev/null | wc -l)"
          ls out/system
          ls out/data 2>/dev/null || true

      # 4. ضغط كل جزء في zip منفصل
      - name: Pack zips
        run: |
          cd out/system && zip -qr ../../system-unpacked.zip . && cd ../..
          if [ -d out/data ] && [ "$(ls -A out/data)" ]; then
            cd out/data && zip -qr ../../data-unpacked.zip . && cd ../..
          fi
          ls -lh *.zip

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: system-and-data-unpacked
          path: |
            system-unpacked.zip
            data-unpacked.zip
          retention-days: 14
