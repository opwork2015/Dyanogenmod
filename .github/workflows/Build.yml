name: Download stock ROM

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: "MediaFire page link"
        required: true
        default: "https://www.mediafire.com/download/swq21w929oz1udm/Stock_ROM_Advanced.zip"
        type: string

jobs:
  download:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # 1. استخراج الرابط المباشر من صفحة MediaFire
      - name: Resolve direct link
        run: |
          curl -sL -A "Mozilla/5.0" "${{ inputs.mediafire_url }}" -o page.html
          DIRECT=$(grep -oE 'https://download[^"]+' page.html | head -1)
          if [ -z "$DIRECT" ]; then
            echo "::error::Could not find direct link on MediaFire page"
            exit 1
          fi
          echo "DIRECT=$DIRECT" >> $GITHUB_ENV
          echo "Direct link found"

      # 2. تنزيل الملف
      - name: Download ROM
        run: |
          curl -L -A "Mozilla/5.0" -o stock.zip "$DIRECT"
          ls -lh stock.zip
          file stock.zip

      # 3. التحقق من أن الملف zip صالح
      - name: Verify zip
        run: |
          unzip -tq stock.zip
          echo "MD5: $(md5sum stock.zip)"

      # 4. عرض المحتويات للتأكد من النوع
      - name: List contents
        run: unzip -l stock.zip | head -60

      # 5. رفع الملف
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: stock-rom
          path: stock.zip
          retention-days: 7
