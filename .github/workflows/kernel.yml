name: Build test kernel (ARM)

on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # 1. تحميل كيرنل Linux الرسمي (آخر نسخة فقط)
      - name: Clone Linux kernel
        run: |
          git clone --depth=1 https://github.com/torvalds/linux.git kernel

      # 2. تثبيت المترجم والأدوات
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev gcc-arm-linux-gnueabi

      # 3. إنشاء الإعداد الافتراضي لمنصة ARM اختبارية
      - name: Configure
        working-directory: kernel
        env:
          ARCH: arm
          CROSS_COMPILE: arm-linux-gnueabi-
        run: make vexpress_defconfig

      # 4. بناء الكيرنل
      - name: Build
        working-directory: kernel
        env:
          ARCH: arm
          CROSS_COMPILE: arm-linux-gnueabi-
        run: make -j$(nproc) zImage

      # 5. التحقق من الناتج
      - name: Check output
        working-directory: kernel
        run: ls -lh arch/arm/boot/zImage

      # 6. رفع الناتج
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: test-kernel-arm
          path: kernel/arch/arm/boot/zImage
          retention-days: 14
