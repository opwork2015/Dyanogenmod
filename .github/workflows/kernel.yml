name: Build kernel j5lte

on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # 1. تحميل مصدر الكيرنل بنسخة خفيفة (آخر commit فقط)
      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/opwork2015/Dyanogenmod.git kernel

      # 2. تثبيت المترجم والأدوات المطلوبة للبناء
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev gcc-arm-linux-gnueabi

      # 3. عرض أسماء الإعدادات المتاحة للتأكد من الاسم الصحيح
      - name: List j5 configs
        working-directory: kernel
        run: ls arch/arm/configs | grep -i j5 || echo "No j5 config found"

      # 4. ضبط الإعدادات وبناء الكيرنل
      # غيّر DEFCONFIG إلى الاسم الذي ظهر في الخطوة السابقة
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm
          CROSS_COMPILE: arm-linux-gnueabi-
          DEFCONFIG: msm8916_sec_j5lte_eur_defconfig
        run: |
          make $DEFCONFIG
          make -j$(nproc)

      # 5. رفع الناتج لتحميله من صفحة Actions
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-j5lte
          path: |
            kernel/arch/arm/boot/zImage*
          retention-days: 14
