name: Validate DyanogenMod tree

on:
  workflow_dispatch:
  push:
    paths:
      - "device/**"
      - "local_manifests/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in \
            device/samsung/j5lte/AndroidProducts.mk \
            device/samsung/j5lte/BoardConfig.mk \
            device/samsung/j5lte/device.mk \
            device/samsung/j5lte/dyanogenmod_j5lte.mk \
            device/samsung/j5lte/system_prop.mk \
            device/samsung/j5lte/vendorsetup.sh \
            local_manifests/dyanogenmod.xml; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required file"
              exit 1
            fi
          done

      - name: Check for leftover placeholders
        run: |
          if grep -rn "YOUR_GITHUB_USERNAME" local_manifests device; then
            echo "::error::Replace YOUR_GITHUB_USERNAME in the manifest with your account name"
            exit 1
          fi

      - name: Validate XML manifests
        run: |
          python3 -c "import xml.dom.minidom,glob; [xml.dom.minidom.parse(f) for f in glob.glob('local_manifests/*.xml')]; print('XML OK')"

      - name: Check product identity
        run: |
          grep -q "PRODUCT_NAME := dyanogenmod_j5lte" device/samsung/j5lte/dyanogenmod_j5lte.mk
          grep -q "PRODUCT_MODEL := SM-J500FN" device/samsung/j5lte/dyanogenmod_j5lte.mk
          echo "Product identity OK"

      - name: Check TODO markers in BoardConfig
        run: |
          echo "Remaining TODO markers:"
          grep -n "TODO" device/samsung/j5lte/BoardConfig.mk || echo "None"

      - name: Package device tree
        run: |
          cd device/samsung && zip -qr $GITHUB_WORKSPACE/j5lte-device-tree.zip j5lte

      - name: Upload device tree
        uses: actions/upload-artifact@v4
        with:
          name: j5lte-device-tree
          path: j5lte-device-tree.zip
          retention-days: 14
